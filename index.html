<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#071416" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="ForjaFit — Seu diário offline de musculação, cargas, séries e evolução." />
  <title>ForjaFit</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Active Workout Sticky Banner -->
    <div id="active-workout-bar" class="active-workout-bar hidden" role="status">
      <div class="awb-left">
        <span class="pulse-dot"></span>
        <div>
          <div class="awb-title" id="awb-title">Treino em andamento</div>
          <div class="awb-meta">
            <span id="awb-clock">00:00</span> •
            <span id="awb-sets">0/0 séries</span> •
            <span id="awb-vol">0 kg</span>
          </div>
        </div>
      </div>
      <div class="awb-actions">
        <button class="btn-mini-danger" id="btn-cancel-workout" title="Cancelar treino">✕</button>
        <button class="btn-mini-accent" id="btn-finish-workout">FINALIZAR</button>
      </div>
    </div>

    <!-- Main Dynamic View Container -->
    <main id="main-view" class="main-view"></main>

    <!-- Floating Rest Timer Pill -->
    <div id="rest-timer-pill" class="rest-timer-pill hidden" aria-live="polite">
      <div class="rtp-info">
        <span class="rtp-label">DESCANSO</span>
        <span class="rtp-time" id="rtp-time">01:30</span>
      </div>
      <div class="rtp-controls">
        <button class="rtp-btn" id="rtp-minus">-15s</button>
        <button class="rtp-btn" id="rtp-plus">+15s</button>
        <button class="rtp-btn rtp-skip" id="rtp-skip">Pular</button>
      </div>
    </div>

    <!-- Bottom Floating Navigation Capsule (5 Tabs) -->
    <nav class="bottom-nav-wrap" aria-label="Navegação principal">
      <div class="bottom-nav">
        <button class="nav-item active" data-tab="plan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11"/><path d="M6.5 17.5h11"/><path d="M4 9v6"/><path d="M20 9v6"/><path d="M7 5v14"/><path d="M17 5v14"/><path d="M7 12h10"/></svg>
          <span>MEU PLANO</span>
        </button>
        <button class="nav-item" data-tab="workouts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>TREINOS</span>
        </button>
        <button class="nav-item" data-tab="progress">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><rect x="6" y="12" width="3" height="8" rx="1"/><rect x="11" y="8" width="3" height="12" rx="1"/><rect x="16" y="4" width="3" height="16" rx="1"/></svg>
          <span>PROGRESSO</span>
        </button>
        <button class="nav-item" data-tab="exercises">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>EXERCÍCIOS</span>
        </button>
        <button class="nav-item" data-tab="profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg>
          <span>PERFIL</span>
        </button>
      </div>
    </nav>

    <!-- Bottom Sheet / Modal Layer -->
    <div id="modal-root"></div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
